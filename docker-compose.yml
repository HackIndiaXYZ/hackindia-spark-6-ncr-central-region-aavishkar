services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

  ai-service:
    build: ./backend/ai-service
    restart: unless-stopped
    ports:
      - "8000:8000"

volumes:
  mongo_data:
